[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/cmux-agent",
  "crates/cmux-agent-chat",
  "crates/cmux-cli",
  "crates/cmux-command-palette",
  "crates/cmux-config",
  "crates/cmux-core",
  "crates/cmux-diff",
  "crates/cmux-golden",
  "crates/cmux-ipc",
  "crates/cmux-markdown",
  "crates/cmux-mentions",
  "crates/cmux-process",
  "crates/cmux-resume",
  "crates/cmux-scrub",
  "crates/cmux-ssh",
  "crates/cmux-terminal",
  "crates/cmux-tmux",
  "crates/cmux-windowing",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/manaflow-ai/cmux"
version = "0.1.0"

[workspace.dependencies]
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "1.0.69"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
