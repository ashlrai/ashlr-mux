[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/cmux-agent",
  "crates/cmux-agent-chat",
  "crates/cmux-agent-hook-config",
  "crates/cmux-agent-launch-sanitizer",
  "crates/cmux-agent-resume-argv",
  "crates/cmux-appearance",
  "crates/cmux-browser-history",
  "crates/cmux-canvas",
  "crates/cmux-cli",
  "crates/cmux-command-palette",
  "crates/cmux-config",
  "crates/cmux-core",
  "crates/cmux-diff",
  "crates/cmux-git",
  "crates/cmux-golden",
  "crates/cmux-ipc",
  "crates/cmux-jsonc",
  "crates/cmux-markdown",
  "crates/cmux-mentions",
  "crates/cmux-notify",
  "crates/cmux-notifications",
  "crates/cmux-pane-guardrail",
  "crates/cmux-panes",
  "crates/cmux-process",
  "crates/cmux-resume",
  "crates/cmux-scrub",
  "crates/cmux-settings-search",
  "crates/cmux-sidebar-args",
  "crates/cmux-ssh",
  "crates/cmux-sync-protocol",
  "crates/cmux-terminal",
  "crates/cmux-tmux",
  "crates/cmux-window-title",
  "crates/cmux-windowing",
  "crates/cmux-workspaces",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/manaflow-ai/cmux"
version = "0.1.0"

[workspace.dependencies]
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "1.0.69"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
