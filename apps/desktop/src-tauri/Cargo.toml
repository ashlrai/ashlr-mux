[package]
name = "cmux-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "cmux_desktop_lib"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cmux-agent = { path = "../../../crates/cmux-agent" }
cmux-agent-chat = { path = "../../../crates/cmux-agent-chat" }
cmux-command-palette = { path = "../../../crates/cmux-command-palette" }
cmux-core = { path = "../../../crates/cmux-core" }
cmux-mentions = { path = "../../../crates/cmux-mentions" }
cmux-diff = { path = "../../../crates/cmux-diff" }
cmux-ipc = { path = "../../../crates/cmux-ipc" }
cmux-markdown = { path = "../../../crates/cmux-markdown" }
cmux-process = { path = "../../../crates/cmux-process" }
cmux-terminal = { path = "../../../crates/cmux-terminal" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# OpenCode's loopback control API is plain HTTP (no TLS). `ureq` is a pure
# blocking client with no tokio dependency (honoring the no-async-runtime rule);
# default-features disabled drops the TLS/json/gzip features we do not need.
ureq = { version = "2", default-features = false }
# Native file picker for the agent composer's `app.pickFiles` (photos & files).
tauri-plugin-dialog = "2"
# Extension→MIME lookup (macOS parity: UTType.preferredMIMEType) + image data URLs.
mime_guess = "2"
base64 = "0.22"
# ISO8601 timestamps for diff-comment createdAt/updatedAt (matches macOS
# `ISO8601DateFormatter`: `YYYY-MM-DDTHH:MM:SSZ`). Default features only — we
# format from `OffsetDateTime::now_utc()` components, no macro/parsing feature.
time = "0.3"

[dev-dependencies]
# Temp fixtures for the diff-store / markdown-asset / scheme unit tests.
tempfile = "3"
