[package]
name = "cmux-agent-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ts-rs = { version = "10.1", optional = true }

[features]
# Opt-in feature that derives `ts_rs::TS` on the serde wire models so the
# agent-session TypeScript bindings can be regenerated. Kept out of the default
# build so normal `cargo test`/`clippy` do not pull in ts-rs.
ts = ["dep:ts-rs"]
