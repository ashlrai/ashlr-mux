[package]
name = "cmux-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cmux-jsonc = { path = "../cmux-jsonc" }
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
ts-rs = { version = "10.1", optional = true }

[features]
# Opt-in feature that derives `ts_rs::TS` on the serde config models so the
# TypeScript bindings can be regenerated. Kept out of the default build so
# normal `cargo test`/`clippy` do not pull in ts-rs. Mirrors `cmux-core`.
ts = ["dep:ts-rs"]
